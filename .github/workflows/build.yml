name: Build PHANTOM-77 (OpenWrt 25.12 Latest Kernel 6.12)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile OpenWrt 25.12 from Source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Toolchain Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 unzip wget \
            python3-distutils python3-setuptools rsync subversion swig time \
            xsltproc zlib1g-dev || true
          if ! command -v python &> /dev/null; then
            sudo ln -sf $(which python3) /usr/bin/python
          fi

      - name: Clone OpenWrt 25.12 (Current Stable LTS Branch)
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Register PHANTOM-77 Device Tree & Board Definition
        run: |
          chmod +x scripts/register-board.sh
          ./scripts/register-board.sh

      - name: Configure Minimalist Linux (.config)
        run: |
          cp phantom-77.config openwrt/.config
          cd openwrt
          make defconfig
          echo "=== Verified Device Profiles in .config ==="
          grep -i "CONFIG_TARGET_DEVICE_ramips_rt305x" .config || true

      - name: Inject Custom Configurations & Branding (files/)
        run: |
          mkdir -p openwrt/files
          cp -r files/* openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/*

      - name: Download Source Tarballs (dl)
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Toolchain, Linux Kernel 6.12, and Rootfs
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Package Firmware Outputs
        run: |
          mkdir -p output
          echo "=== All files in openwrt/bin/targets/ramips/rt305x/ ==="
          ls -la openwrt/bin/targets/ramips/rt305x/ || true
          
          echo "=== All .bin files across openwrt/bin/ ==="
          find openwrt/bin/ -type f -name "*.bin" || true
          
          # Priority 1: phantom-77 sysupgrade
          SYSUPGRADE=$(find openwrt/bin/targets/ramips/rt305x/ -type f -name "*phantom*sysupgrade.bin" | head -n 1)
          
          # Priority 2: 3g150b sysupgrade
          if [ -z "$SYSUPGRADE" ]; then
            SYSUPGRADE=$(find openwrt/bin/targets/ramips/rt305x/ -type f -name "*3g150b*sysupgrade.bin" | head -n 1)
          fi
          
          # Priority 3: any sysupgrade.bin
          if [ -z "$SYSUPGRADE" ]; then
            SYSUPGRADE=$(find openwrt/bin/targets/ramips/rt305x/ -type f -name "*sysupgrade.bin" | head -n 1)
          fi
          
          # Priority 4: any .bin in rt305x
          if [ -z "$SYSUPGRADE" ]; then
            SYSUPGRADE=$(find openwrt/bin/targets/ramips/rt305x/ -type f -name "*.bin" | head -n 1)
          fi
          
          if [ -n "$SYSUPGRADE" ]; then
            echo "Selected firmware image: $SYSUPGRADE"
            cp "$SYSUPGRADE" output/Kernal.bin
            cp "$SYSUPGRADE" output/phantom-77-latest-sysupgrade.bin
            cp openwrt/bin/targets/ramips/rt305x/*.bin output/ 2>/dev/null || true
          else
            echo "ERROR: No firmware binary found in bin/targets/ramips/rt305x/"
            exit 1
          fi
          
          echo "=== Package outputs created successfully ==="
          ls -lh output/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PHANTOM-77-Latest-Kernel-6.12
          path: output/*
          retention-days: 14
